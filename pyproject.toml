[project]
name = "project-name"
version = "0.1.0"
description = "One line: the problem this project solves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharghav Madhiraju" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
project-name = "project_name.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

# ---------- Ruff: linting + formatting ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # modern Python syntax
    "SIM",      # simplifications
    "N",        # naming
    "PD",       # pandas pitfalls
    "NPY",      # numpy pitfalls
    "RUF",
]

# ---------- Pytest + coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=project_name --cov-report=term-missing"
markers = [
    "slow: tests that take more than a few seconds",
    "integration: end-to-end tests across modules",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 70
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
